
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e0f2fe" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garden Tycoon</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fredoka Font for Round/Cute look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #e0f2fe;
        /* Softer, cleaner background pattern */
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 50%);
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* 3D Button Press Effect Helper */
      .btn-3d {
        transition: all 0.1s;
        transform: translateY(0);
        box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      }
      .btn-3d:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 rgba(0,0,0,0);
      }

      /* Floating Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      /* Pulse Glow */
      @keyframes glow {
        0% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
        50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }
      }
      
      /* Weather Animations */
      @keyframes rain-fall { 0% { transform: translateY(-100vh); } 100% { transform: translateY(100vh); } }
      @keyframes hail-fall { 0% { transform: translateY(-100vh); } 100% { transform: translateY(100vh); } }
      @keyframes snow-fall { 0% { transform: translateY(-100vh) rotate(0deg); } 100% { transform: translateY(100vh) rotate(360deg); } }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @keyframes heat-shimmer { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.5; } }
      @keyframes eclipse-pulse { 0%, 100% { box-shadow: 0 0 20px 2px rgba(253,224,71,0.2); } 50% { box-shadow: 0 0 40px 10px rgba(253,224,71,0.4); } }
      @keyframes sand-move { 0% { transform: translateX(0); } 100% { transform: translateX(150vw); } }
      @keyframes meteor-shoot { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(-200px, 200px) scale(0); opacity: 0; } }
      @keyframes aurora-wave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes float-up { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
      @keyframes fog-move { 0% { transform: translateX(-50%); } 50% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
      
      /* Animate-in Polyfills for Vercel/CDN deployment */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      @keyframes slide-in-from-bottom { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes slide-in-from-top { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes slide-in-from-left { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

      .animate-in { animation-duration: 0.3s; animation-fill-mode: forwards; }
      .fade-in { animation-name: fade-in; }
      .zoom-in { animation-name: zoom-in; }
      .slide-in-from-bottom-5 { animation-name: slide-in-from-bottom; }
      .slide-in-from-bottom-10 { animation-name: slide-in-from-bottom; }
      .slide-in-from-top-4 { animation-name: slide-in-from-top; }
      .slide-in-from-top-10 { animation-name: slide-in-from-top; }
      .slide-in-from-left-10 { animation-name: slide-in-from-left; }
      .duration-300 { animation-duration: 0.3s; }
      .duration-500 { animation-duration: 0.5s; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
    </style>
<script type="importmap">
{
  "imports": {

  }
}
</script>

</head>

</body>
</html>
